# 单机部署参考配置（不使用 Docker 时）
#
# 用法：
#   1) 前端构建产物 `frontend/dist/*` 解压到 /var/www/campusfix
#   2) 后端 `java -jar campusfix.jar` 监听 127.0.0.1:8080
#   3) 本文件放到 /etc/nginx/conf.d/campusfix.conf 后 nginx -s reload
#
# 该模式下前端与后端同源：前端构建时保持
#   VITE_API_BASE_URL=/api/v1
#   VITE_ASSET_BASE_URL=
# 即可，不需要后端开跨域。

upstream campusfix_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /var/www/campusfix;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://campusfix_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /files/ {
        proxy_pass http://campusfix_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------
# 另一种形态：前后端分域（前端 www.example.com，后端 api.example.com）
#
# 这时前端构建要改成直连后端：
#   VITE_API_BASE_URL=https://api.example.com/api/v1
#   VITE_ASSET_BASE_URL=https://api.example.com
# 后端需放行前端源：
#   CORS_ALLOWED_ORIGINS=https://www.example.com
#   STORAGE_PUBLIC_BASE_URL=https://api.example.com
# 此时「前端站点」不需要 /api 与 /files 的反代，只保留 SPA fallback 即可。
# ---------------------------------------------------------------
