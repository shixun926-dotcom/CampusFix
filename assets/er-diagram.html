<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CampusFix 数据库 ER 图</title>
<style>
  :root { --bd:#D3D1C7; --tp:#2C2C2A; --ts:#5F5E5A; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 40px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #FAF9F5; color: var(--tp);
  }
  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size: 16px; font-weight: 500; margin: 0; }
  .sub { font-size: 12px; color: var(--ts); }
  .toolbar { display:flex; gap:8px; margin-bottom: 14px; align-items:center; }
  button {
    font: inherit; font-size: 12px; padding: 5px 12px; cursor: pointer;
    background:#fff; border:1px solid var(--bd); border-radius: 6px; color: var(--tp);
  }
  button:hover { background:#F1EFE8; }
  .hint { font-size: 11px; color: var(--ts); margin-left: 6px; }
  #stage {
    border: 1px solid var(--bd); border-radius: 10px; background:#fff;
    overflow: auto; max-height: 78vh; padding: 8px;
  }
  #stage img { display:block; width: 100%; height: auto; transform-origin: 0 0; }
</style>
</head>
<body>
<header>
  <h1>CampusFix 数据库 ER 图</h1>
  <span class="sub">20 个核心实体 · 25 条关系 · 平台域 / 工单域 / 资产域</span>
</header>

<div class="toolbar">
  <button onclick="zoom(1.25)">放大</button>
  <button onclick="zoom(0.8)">缩小</button>
  <button onclick="reset()">重置</button>
  <span class="hint">矢量图，可无损缩放；浏览器内可直接 Ctrl+滚轮 缩放</span>
</div>

<div id="stage">
  <img id="svg" src="er-diagram.svg" alt="CampusFix 数据库 ER 图">
</div>

<script>
  let scale = 1;
  const img = document.getElementById('svg');
  function apply() { img.style.width = (scale * 100) + '%'; }
  function zoom(f) { scale = Math.min(6, Math.max(0.5, scale * f)); apply(); }
  function reset() { scale = 1; apply(); }
</script>
</body>
</html>
