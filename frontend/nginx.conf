# 前端容器内的 Nginx：静态站点 + API 反代
# 前后端同源（浏览器只看到前端域），因此无需开跨域，图片相对路径也能正常解析。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大小与后端 maxImageMb 保持一致，留 2MB 余量
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ^~ 保证前缀匹配后不再被下面的正则 location 抢走
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 把后端的 traceId 透出，便于前端排错时对照日志
        proxy_pass_header X-Trace-Id;
    }

    # 上传的图片由后端提供（本地存储模式）
    location ^~ /files/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 带哈希的静态资源可长缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：刷新 /orders 这类前端路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
